[package]
name = "openfortivpn-gui"
version = "0.1.0"
edition = "2021"
description = "Linux GUI for openfortivpn with tray integration"

[dependencies]
eframe = "0.29"
egui = "0.29"
tray-icon = { version = "0.19", default-features = false }
gtk = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
libc = "0.2"
dirs = "5"
notify-rust = "4"

[profile.release]
lto = "thin"
strip = true